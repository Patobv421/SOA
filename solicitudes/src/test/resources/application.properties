spring.application.name=solicitudes

# En las pruebas se usa una base H2 en memoria, no hace falta PostgreSQL
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Estas direcciones no se usan porque en las pruebas los otros servicios se simulan
servicios.usuarios.url=http://localhost:9991
servicios.inventario.url=http://localhost:9992
servicios.tiempo-espera-segundos=1
