spring.application.name=solicitudes

# Puerto de este servicio (Servicio 2)
server.port=8082

# Base de datos PostgreSQL propia de este servicio (se crea con base_de_datos.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/solicitudes_db
spring.datasource.username=solicitudes_user
spring.datasource.password=solicitudes123

# Hibernate crea o actualiza las tablas solo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Direcciones de los otros servicios (Servicio 3 Usuarios y Servicio 1 Inventario)
servicios.usuarios.url=http://localhost:8083
servicios.inventario.url=http://localhost:8081

# Segundos maximos que se espera la respuesta de otro servicio
servicios.tiempo-espera-segundos=3
