spring.application.name=inventario-deportivo

server.address=127.0.0.1
server.port=9000

# Conexion con postgre
spring.datasource.url=${INVENTARIO_DB_URL:jdbc:postgresql://localhost:5432/inventario_deportivo_catalogo}
spring.datasource.username=${INVENTARIO_DB_USER:inventario_app}
spring.datasource.password=${INVENTARIO_DB_PASSWORD}

# Tiempos espera
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'

# Validar DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Validacion JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Mapeo errores
server.error.include-stacktrace=never
server.error.include-message=never