spring.application.name=usuarios

# En las pruebas se usa una base H2 en memoria, no hace falta PostgreSQL
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

reglas.limite-alumno=2
reglas.limite-docente=4
reglas.dias-suspension-grave=15
reglas.leves-para-suspender=3
reglas.dias-suspension-leves=7
