spring.application.name=usuarios

# Puerto de este servicio (Servicio 3). Solicitudes lo busca aqui.
server.port=8083

# Base de datos PostgreSQL propia de este servicio (se crea con base_de_datos.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/usuarios_db
spring.datasource.username=usuarios_user
spring.datasource.password=usuarios123

# Hibernate crea o actualiza las tablas solo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Reglas de negocio (se cambian aqui sin tocar el codigo)
# Solicitudes activas que puede tener cada tipo de usuario al mismo tiempo
reglas.limite-alumno=2
reglas.limite-docente=4
# Dias de suspension por una incidencia grave
reglas.dias-suspension-grave=15
# Con esta cantidad de incidencias leves en 30 dias se suspende
reglas.leves-para-suspender=3
reglas.dias-suspension-leves=7
