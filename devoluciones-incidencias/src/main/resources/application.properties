spring.application.name=devoluciones-incidencias

server.address=127.0.0.1
# Puerto 9010 para no chocar con inventario (9000) ni solicitudes (8082)
server.port=9010

# Conexion local con postgres
spring.datasource.url=${DEVOLUCIONES_DB_URL:jdbc:postgresql://localhost:5432/devoluciones_db}
spring.datasource.username=${DEVOLUCIONES_DB_USER:postgres}
spring.datasource.password=${DEVOLUCIONES_DB_PASSWORD:postgres}

# Tiempos de espera
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'

# Validar esquema existente contra Postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Validacion estricta JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Ocultar traza en errores
server.error.include-stacktrace=never
server.error.include-message=never

# Cmunicacion con Inventario
servicios.inventario.url=http://127.0.0.1:9000/api/articulos
servicios.inventario.timeout=4000

# Comunicacion con Usuarios (Servicio 3)
servicios.usuarios.url=http://127.0.0.1:8083/api/usuarios
servicios.usuarios.timeout=4000
